  name: Sync with upstream
  on:
    push:
    schedule:
      - cron: "3 */8 * * *"
    workflow_dispatch:

  jobs:
    sync-mirror:
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - name: Create root stub
          run: |
            echo "module pocket-id-root" > go.mod
            echo "go 1.26" >> go.mod
        - name: Update mirror
          uses: projg2/golang-dist-mirror-action@v1
          with:
            token: ${{ secrets.PUSH_TOKEN }}
